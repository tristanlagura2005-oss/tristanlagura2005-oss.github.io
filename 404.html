<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Tristan Lagura</title>
  <style>
    :root{color-scheme:light;--navy:#0f2744;--blue:#1d4ed8;--gold:#f3ce73;--bg:#f7f9fc;--muted:#526176}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--navy);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(680px,100%);padding:clamp(28px,7vw,64px);border:1px solid #dce3ec;border-radius:28px;background:#fff;box-shadow:0 24px 70px rgba(15,39,68,.14);text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 24px;display:grid;place-items:center;border-radius:17px;background:var(--navy);color:#fff;font-weight:900;letter-spacing:-.05em}
    .code{margin:0;color:var(--blue);font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:.35rem 0 1rem;font-size:clamp(2rem,7vw,4.5rem);line-height:1;letter-spacing:-.055em}p{max-width:48ch;margin:0 auto 1.6rem;color:var(--muted)}a{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1.1rem;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;text-decoration:none}a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">TL</div>
    <p class="code">404 error</p>
    <h1>That page is not here.</h1>
    <p>The link may be outdated, or the page may have moved. Return to Tristan Lagura's portfolio.</p>
    <a id="home-link" href="./">Back to portfolio</a>
  </main>
  <script>
    (function(){
      var link=document.getElementById('home-link');
      var isGitHub=location.hostname.endsWith('github.io');
      var parts=location.pathname.split('/').filter(Boolean);
      link.href=(isGitHub&&parts[0]==='tristan-lagura-portfolio')?'/tristan-lagura-portfolio/':'/';
    }());
  </script>
</body>
</html>
